name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the package
      run: python -m pip install -e ".[dev]"

    - name: Run the tests
      run: python -m pytest tests -q

    # The one part that imports IvoryOS, which the tests above run without.
    - name: Import the Labware view
      run: |
        python -m pip install ivoryos-edge
        python -c "from plr_ivoryos.labware_view import plugin; print(plugin.id)"

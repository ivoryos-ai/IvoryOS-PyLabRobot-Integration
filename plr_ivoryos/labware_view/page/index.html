<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labware</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --soft: #f3f4f6;
      --deck: #f8fafc; --deck-floor: #f1f5f9; --site: #cbd5e1; --ware: #ffffff; --ware-line: #94a3b8; --well: #eef2f6;
      --well-line: #b6c2cf; --tip: #475569; --fixture: #e2e8f0; --rail: #e2e8f0;
      --accent: #4a6280; --accent-soft: #e7edf4; --accent-fg: #34495f; --on-accent: #ffffff;
      --warn-bg: #fef3c7; --warn-fg: #92400e; --err-bg: #fee2e2; --err-fg: #991b1b;
      font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    :root.dark {
      --bg: #141414; --ink: #f3f4f6; --muted: #9ca3af; --line: rgba(255,255,255,.1); --soft: rgba(255,255,255,.06);
      --deck: #1b1d20; --deck-floor: #202327; --site: #3f4750; --ware: #23272c; --ware-line: #5b6672; --well: #2c3138;
      --well-line: #4a535d; --tip: #b8c4d1; --fixture: #2a2f35; --rail: #2a2f35;
      --accent: #a9bed5; --accent-soft: rgba(140,170,205,.16); --accent-fg: #c9d7e6; --on-accent: #0f1a26;
      --warn-bg: rgba(245,158,11,.14); --warn-fg: #fcd34d; --err-bg: rgba(239,68,68,.16); --err-fg: #fca5a5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--ink); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .kind { color: var(--muted); font-size: 12px; }
    .live { margin-left: auto; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; display: inline-block; }
    .live.on i { background: #22c55e; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 9px; }
    .tab.on { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
    select { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; }
    input[type=text], input[type=search], input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; min-width: 0; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .act { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 7px; padding: 3px 10px; font-weight: 600; }
    .act:disabled { opacity: .45; cursor: default; }
    .plain { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 10px; }
    .note { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; padding: 7px 9px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 12px; }
    .note.error { background: var(--err-bg); color: var(--err-fg); }
    .note button { margin-left: auto; }
    #stage { border: 1px solid var(--line); border-radius: 12px; background: var(--deck); overflow: hidden; position: relative; user-select: none; touch-action: none; }
    svg { display: block; width: 100%; height: auto; max-height: 64vh; }
    #reset { position: absolute; top: 8px; right: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 3px 9px; font-size: 12px; }
    #activity { min-height: 20px; margin: 8px 2px 4px; font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #activity b { color: var(--ink); font-weight: 600; }
    .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    .bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
    .bar b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #editor { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    #editor .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
    #editor p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    #palette { max-height: 240px; overflow: auto; margin-top: 6px; border-top: 1px solid var(--line); user-select: none; }
    .group { position: sticky; top: 0; background: var(--bg); padding: 5px 2px 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .def { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; cursor: grab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; touch-action: none; }
    .def:hover { background: var(--soft); }
    .def.on { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
    #ghost { position: fixed; z-index: 10; pointer-events: none; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 4px 14px rgba(0,0,0,.18); transform: translate(10px, 10px); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 2px 10px; font-size: 12px; color: var(--muted); }
    .chip { display: inline-flex; align-items: center; gap: 5px; }
    .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
    td.name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    td.name input { font-family: inherit; font-weight: 600; width: 10rem; padding: 2px 6px; }
    td.dim { color: var(--muted); }
    td.grow { width: 100%; white-space: normal; }
    tr.row { cursor: pointer; }
    tr.row:hover td, tr.row.sel td { background: var(--soft); }
    .x { border: none; background: transparent; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
    .x:hover { color: var(--err-fg); }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); }

    .floor { fill: var(--deck-floor); }
    .rail { stroke: var(--rail); stroke-width: .9; }
    .rail-no { fill: var(--muted); font-size: 7px; text-anchor: middle; }
    .rail-mark { stroke: var(--accent); stroke-width: 2.4; }
    .rail-label { fill: var(--accent); font-size: 11px; font-weight: 700; }
    .preview { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 2; }
    .site { fill: none; stroke: var(--site); stroke-width: .7; stroke-dasharray: 2.4 2; }
    .site.drop { fill: transparent; }
    .site.armed { stroke: var(--accent); stroke-width: 1.4; fill: var(--accent-soft); }
    .site-label { fill: var(--site); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .fixture { fill: var(--fixture); stroke: var(--site); stroke-width: .5; }
    .fixture.movable { cursor: grab; }
    .fixture-name { fill: var(--muted); font-size: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
    .trash { fill: var(--fixture); stroke: var(--ware-line); stroke-width: .6; stroke-dasharray: 1.5 1.5; }
    .ware { fill: var(--ware); stroke: var(--ware-line); stroke-width: .8; cursor: pointer; }
    .editing .ware.movable { cursor: grab; }
    .ware.sel { stroke: var(--accent); stroke-width: 1.6; }
    .ware.lifted, .fixture.lifted { opacity: .35; }
    .ware-name { fill: var(--ink); font-size: 5px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
    .ware-site { fill: var(--muted); font-size: 4.6px; text-anchor: end; pointer-events: none; }
    .remove { cursor: pointer; }
    .remove circle { fill: var(--bg); stroke: var(--ware-line); stroke-width: .5; }
    .remove path { stroke: var(--muted); stroke-width: .9; stroke-linecap: round; }
    .remove:hover circle { stroke: #dc2626; }
    .remove:hover path { stroke: #dc2626; }
    .well { fill: var(--well); stroke: var(--well-line); stroke-width: .35; }
    .picking .well { cursor: crosshair; }
    .picked { fill: none; stroke: var(--accent); stroke-width: 1.1; pointer-events: none; }
    .tip { fill: var(--tip); }
    .tip.used { fill: none; stroke: var(--well-line); stroke-width: .4; }
    .hit { stroke: var(--accent); stroke-width: 1.3; fill: none; animation: hit 1.1s ease-out infinite; }
    @keyframes hit { 0% { stroke-opacity: 1; } 100% { stroke-opacity: .25; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Labware</h1><span class="kind" id="kind"></span>
    <div class="tabs" id="tabs"></div>
    <button class="tab" id="edit" hidden>Edit layout</button>
    <span class="live" id="live"><i></i><span>connecting</span></span>
  </header>
  <div id="notes"></div>
  <div id="stage"></div>
  <div id="fill"></div>
  <div id="activity"></div>
  <div id="editor" hidden></div>
  <div class="legend" id="legend"></div>
  <table id="list"></table>
  <datalist id="liquid-names"></datalist>
  <div id="ghost" hidden></div>

  <script>
    // Relative URLs only: the page is served under /plugins/labware/ on whatever host the edge uses.
    // Everything drawn comes from api/layout and api/state; nothing here knows a robot or a plate.
    let layouts = {}, states = {}, catalogs = {}, current = null, zoomed = null;
    let hit = { labware: null, wells: new Set() }, hitTimer = null;
    // Editing: changes apply as they are made (no confirming); `restart` once the deck must restart
    // for steps to offer what changed; `notice` is the last refusal, in the driver's words.
    let editing = false, restart = false, notice = null, query = "", armed = null;
    let picked = new Set();                 // wells chosen on the zoomed labware, for a liquid
    let liquid = { name: "", volume: "" };  // what the fill bar holds
    let geom = null;                        // how the drawing maps to millimetres
    let drag = null;                        // what is being dragged, and where it would go

    // The app's theme: its own setting in a browser, the system's inside the desktop app.
    function applyTheme() {
      let saved = null;
      try { saved = localStorage.getItem("ivoryos-theme"); } catch (e) { /* private window */ }
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    }
    applyTheme();
    addEventListener("storage", applyTheme);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = n => String(Math.round(n * 10) / 10);

    // A liquid named after a colour is drawn in it; the rest take the next colour in turn.
    const NAMED = { red: "#dc2626", blue: "#2563eb", yellow: "#eab308", green: "#16a34a", orange: "#ea580c",
                    pink: "#db2777", black: "#1f2937", water: "#7dd3fc", buffer: "#7dd3fc", dye: "#e11d48" };
    const TURN = ["#0d9488", "#ea580c", "#65a30d", "#0284c7", "#d97706", "#be185d", "#64748b", "#ca8a04"];
    const colours = {};
    function colourOf(name) {
      if (!colours[name]) {
        const word = Object.keys(NAMED).find(w => name.toLowerCase().includes(w));
        colours[name] = word ? NAMED[word] : TURN[Object.keys(colours).length % TURN.length];
      }
      return colours[name];
    }
    function mixed(liquids) {
      let r = 0, g = 0, b = 0, total = 0;
      for (const [name, volume] of Object.entries(liquids || {})) {
        const c = colourOf(name);
        r += parseInt(c.slice(1, 3), 16) * volume; g += parseInt(c.slice(3, 5), 16) * volume; b += parseInt(c.slice(5, 7), 16) * volume;
        total += volume;
      }
      return total ? `rgb(${Math.round(r / total)},${Math.round(g / total)},${Math.round(b / total)})` : "var(--well)";
    }
    const shortWells = wells => {
      const unique = [...new Set(wells)];
      return unique.length <= 3 ? unique.join(", ") : `${unique[0]} … ${unique[unique.length - 1]} (${unique.length})`;
    };
    const holdsLiquid = ware => ware && ware.category !== "tip_rack";

    // --- the drawing --------------------------------------------------------------------------------

    // Redrawing replaces the fields too: keep the one being typed in focused, caret and all.
    function render() {
      const active = document.activeElement;
      const key = active && (active.id || (active.dataset && active.dataset.rename !== undefined ? `rename:${active.dataset.rename}` : ""));
      const caret = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
      draw();
      if (!key) return;
      const again = key.startsWith("rename:")
        ? document.querySelector(`[data-rename="${CSS.escape(key.slice(7))}"]`) : document.getElementById(key);
      if (again && again !== active && /^(INPUT|SELECT)$/.test(again.tagName)) {
        again.focus();
        if (caret && typeof again.setSelectionRange === "function") try { again.setSelectionRange(caret[0], caret[1]); } catch (e) { /* a number field */ }
      }
    }

    function draw() {
      const names = Object.keys(layouts);
      $("tabs").innerHTML = names.length > 1
        ? names.map(n => `<button class="tab ${n === current ? "on" : ""}" data-tab="${esc(n)}">${esc(n)}</button>`).join("") : "";
      const offered = catalogs[current] || {};
      const canEdit = (offered.labware || []).length > 0 || (offered.decks || []).length > 0;
      $("edit").hidden = !canEdit;
      $("edit").classList.toggle("on", editing);
      $("edit").textContent = editing ? "Done" : "Edit layout";
      renderNotes();
      if (!current || !layouts[current]) {
        $("stage").innerHTML = `<div class="empty">No instrument on this deck reports a worktable.<br>A plr-ivoryos LiquidHandler does.</div>`;
        $("kind").textContent = "";
        $("legend").innerHTML = $("list").innerHTML = $("fill").innerHTML = "";
        return;
      }
      const layout = layouts[current], state = (states[current] || {}).labware || {};
      $("title").textContent = current;
      $("kind").textContent = (layout.deck.label || layout.deck.kind) + (layout.deck.simulated ? " · simulated" : "");
      if (zoomed && !layout.labware[zoomed]) zoomed = null;

      // Millimetres from the front left; the page's y runs the other way. The frame is the whole
      // width of the worktable (every slot or rail, used or not), and as deep as what is on it:
      // PyLabRobot's Tecan deck is 780 mm deep with its carriers in the front 350.
      const content = [...layout.sites, ...layout.fixtures, ...Object.values(layout.labware)];
      const deckBox = { x: 0, y: 0, w: layout.deck.width, h: layout.deck.depth };
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const b of [deckBox, ...content]) { x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.w); }
      for (const b of content.length ? content : [deckBox]) { y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.h); }
      const pad = 10, top = y1;
      const Y = (y, h) => top - (y + h);
      let view = [x0 - pad, -pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad];
      const focus = zoomed && layout.labware[zoomed];
      if (focus) view = [focus.x - 6, Y(focus.y, focus.h) - 6, focus.w + 12, focus.h + 12];
      geom = { top, x0, x1, y0, y1 };

      // The floor is everything drawn: PyLabRobot puts some carriers (a Tecan's) past its deck's edge.
      let svg = `<rect class="floor" x="${x0}" y="0" width="${x1 - x0}" height="${y1 - y0}" rx="6"/>`;
      // Rails (Hamilton, Tecan): where carriers go. Numbered every five, as on the robot.
      for (const r of layout.deck.rails || []) {
        svg += `<line class="rail" x1="${r.x}" x2="${r.x}" y1="0" y2="${y1 - y0}"/>`;
        if (r.rail === 1 || r.rail % 5 === 0) svg += `<text class="rail-no" x="${r.x}" y="${y1 - y0 + 8}">${r.rail}</text>`;
      }
      for (const f of layout.fixtures) {
        const movable = editing && f.category === "carrier" && f.editable && f.rails;
        svg += `<rect class="${f.category === "trash" ? "trash" : "fixture"} ${movable ? "movable" : ""}" ${movable ? `data-carrier="${esc(f.name)}"` : ""} x="${f.x}" y="${Y(f.y, f.h)}" width="${Math.max(f.w, 6)}" height="${f.h}" rx="3"><title>${esc(f.name)}${f.rails ? ` · rail ${f.rails}` : ""}</title></rect>`;
        if (f.category === "trash" && f.w > 30) svg += `<text class="site-label" style="font-size:9px" x="${f.x + f.w / 2}" y="${Y(f.y, f.h) + f.h / 2}">trash</text>`;
        if (f.category === "carrier" && f.rails) svg += `<text class="fixture-name" x="${f.x + 2}" y="${Y(f.y, f.h) + f.h - 3}">${esc(f.name)} · rail ${f.rails}</text>`;
        if (editing && f.editable && f.category === "carrier") svg += removeMark(f.name, f.x + f.w - 5, Y(f.y, f.h) + 5);
      }
      for (const s of layout.sites) {
        svg += `<rect class="site ${editing && !s.holds ? "drop" : ""}" data-site="${esc(s.label)}" x="${s.x}" y="${Y(s.y, s.h)}" width="${s.w}" height="${s.h}" rx="3"/>`;
        if (!s.holds && s.w > 40) svg += `<text class="site-label" x="${s.x + s.w / 2}" y="${Y(s.y, s.h) + s.h / 2}">${esc(String(s.label).replace(/^.*-/, ""))}</text>`;
      }
      const choosing = editing && focus && holdsLiquid(focus);
      for (const [name, ware] of Object.entries(layout.labware)) {
        const held = state[name] || {}, tips = ware.category === "tip_rack";
        const wy = Y(ware.y, ware.h);
        svg += `<rect class="ware ${zoomed === name ? "sel" : ""} ${ware.editable ? "movable" : ""}" data-ware="${esc(name)}" x="${ware.x}" y="${wy}" width="${ware.w}" height="${ware.h}" rx="2.5"/>`;
        ware.grid.forEach((row, r) => row.forEach((id, c) => {
          const spot = ware.spots[id];
          if (!spot) return;
          const [dx, dy, w, h, round] = spot;
          const cx = ware.x + dx + w / 2, cy = top - (ware.y + dy + h / 2);
          const here = held[id] || {};
          const active = hit.labware === name && hit.wells.has(id);
          const pick = choosing && zoomed === name ? `data-well="${esc(id)}" data-r="${r}" data-c="${c}"` : "";
          if (tips) {
            const rr = Math.min(3.1, ware.w / (ware.grid[0].length * 2.9));
            svg += `<circle class="tip ${here.tip === false ? "used" : ""}" cx="${cx}" cy="${cy}" r="${rr}"><title>${esc(name)}[${esc(id)}] · ${here.tip === false ? "used" : "tip"}</title></circle>`;
            if (active) svg += `<circle class="hit" cx="${cx}" cy="${cy}" r="${rr + 1}"/>`;
            return;
          }
          const volume = here.volume_ul || 0, full = ware.max_volume_ul ? Math.min(1, volume / ware.max_volume_ul) : (volume ? 1 : 0);
          const parts = Object.entries(here.liquids || {}).map(([l, v]) => `${l} ${fmt(v)}`).join(", ");
          const label = `<title>${esc(name)}[${esc(id)}] · ${volume ? `${fmt(volume)} µL${parts ? ` (${esc(parts)})` : ""}` : "empty"}</title>`;
          const chosen = choosing && zoomed === name && picked.has(id);
          if (round) {
            const rr = Math.min(w, h) / 2;
            svg += `<circle class="well" ${pick} cx="${cx}" cy="${cy}" r="${rr}">${label}</circle>`;
            if (volume) svg += `<circle cx="${cx}" cy="${cy}" r="${rr * (0.4 + 0.55 * Math.sqrt(full))}" fill="${mixed(here.liquids)}" pointer-events="none"/>`;
            if (active) svg += `<circle class="hit" cx="${cx}" cy="${cy}" r="${rr + 0.9}"/>`;
            if (chosen) svg += `<circle class="picked" cx="${cx}" cy="${cy}" r="${rr + 0.6}"/>`;
          } else {
            const x = ware.x + dx, y = top - (ware.y + dy + h);
            svg += `<rect class="well" ${pick} x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2">${label}</rect>`;
            // Seen from above a trough has no level to show, so how full it is is how much of it is tinted.
            if (volume) svg += `<rect x="${x + 0.6}" y="${y + 0.6 + (h - 1.2) * (1 - full)}" width="${w - 1.2}" height="${(h - 1.2) * full}" rx="0.9" fill="${mixed(here.liquids)}" pointer-events="none"/>`;
            if (active) svg += `<rect class="hit" x="${x - 0.8}" y="${y - 0.8}" width="${w + 1.6}" height="${h + 1.6}" rx="1.6"/>`;
            if (chosen) svg += `<rect class="picked" x="${x - 0.6}" y="${y - 0.6}" width="${w + 1.2}" height="${h + 1.2}" rx="1.6"/>`;
          }
        }));
        svg += `<text class="ware-name" x="${ware.x + 3}" y="${wy + 5.6}">${esc(name)}</text>`;
        if (ware.site && !(editing && ware.editable)) svg += `<text class="ware-site" x="${ware.x + ware.w - 3}" y="${wy + 5.6}">${esc(String(ware.site).replace(/^.*-/, "#"))}</text>`;
        if (editing && ware.editable && !focus) svg += removeMark(name, ware.x + ware.w - 4.5, wy + 4.5);
      }
      // Where a dragged carrier would go: drawn on top, moved as the pointer moves.
      svg += `<g id="railmark" visibility="hidden"><rect class="preview" id="railbox" rx="3"/><line class="rail-mark" id="railline"/><text class="rail-label" id="raillabel"/></g>`;
      $("stage").innerHTML = `<svg class="${editing ? "editing" : ""} ${choosing ? "picking" : ""}" viewBox="${view.join(" ")}" role="img" aria-label="${esc(current)} worktable">${svg}</svg>`
        + (focus ? `<button id="reset">Whole worktable</button>` : "");

      const known = new Set();
      for (const held of Object.values(state)) for (const spot of Object.values(held)) for (const l of Object.keys(spot.liquids || {})) known.add(l);
      $("legend").innerHTML = [...known].sort().map(l => `<span class="chip"><i style="background:${colourOf(l)}"></i>${esc(l)}</span>`).join("")
        + (Object.values(layout.labware).some(w => w.category === "tip_rack") ? `<span class="chip"><i style="background:var(--tip)"></i>tip</span>` : "");
      $("liquid-names").innerHTML = [...known].sort().map(l => `<option value="${esc(l)}">`).join("");

      $("list").innerHTML = Object.entries(layout.labware).map(([name, ware]) => {
        const held = state[name] || {}, spots = Object.keys(ware.spots).length;
        let what;
        if (ware.category === "tip_rack") what = `${Object.values(held).filter(s => s.tip !== false).length} of ${spots} tips left`;
        else {
          const filled = Object.values(held).filter(s => s.volume_ul > 0);
          const total = filled.reduce((sum, s) => sum + s.volume_ul, 0);
          what = filled.length ? `${filled.length} of ${spots} ${spots === 1 ? "filled" : "wells hold liquid"} · ${total >= 1000 ? fmt(total / 1000) + " mL" : fmt(total) + " µL"}` : "empty";
        }
        const named = editing && ware.editable
          ? `<input type="text" data-rename="${esc(name)}" value="${esc(name)}" aria-label="Name of ${esc(name)}" spellcheck="false">`
          : esc(name);
        return `<tr class="row ${zoomed === name ? "sel" : ""}" data-ware="${esc(name)}"><td class="name">${named}</td><td class="dim">${esc(ware.category.replace("_", " "))}</td><td class="dim">${ware.site ? esc(ware.site) : ""}</td><td class="grow">${esc(what)}</td>${editing && ware.editable ? `<td><button class="x" data-remove="${esc(name)}" title="Take ${esc(name)} off the worktable" aria-label="Remove ${esc(name)}">×</button></td>` : ""}</tr>`;
      }).join("");
      renderFill();
      renderEditor();
    }

    function removeMark(name, cx, cy) {
      return `<g class="remove" data-remove="${esc(name)}"><title>Take ${esc(name)} off the worktable</title><circle cx="${cx}" cy="${cy}" r="3.4"/><path d="M${cx - 1.4} ${cy - 1.4} L${cx + 1.4} ${cy + 1.4} M${cx + 1.4} ${cy - 1.4} L${cx - 1.4} ${cy + 1.4}"/></g>`;
    }

    function renderNotes() {
      let html = "";
      if (notice) html += `<div class="note error"><span>${esc(notice)}</span><button class="plain" id="dismiss">OK</button></div>`;
      if (restart) html += `<div class="note"><span>The worktable changed. Steps offer what changed once the deck restarts.</span><button class="act" id="restart">Restart deck</button></div>`;
      $("notes").innerHTML = html;
    }

    // --- filling wells (edit mode, zoomed on a plate or reservoir) -----------------------------------

    function renderFill() {
      const layout = layouts[current], ware = layout && zoomed && layout.labware[zoomed];
      if (!editing || !holdsLiquid(ware)) { $("fill").innerHTML = ""; return; }
      const n = picked.size;
      $("fill").innerHTML = `<div class="bar">
        <span>${n ? `<b>${esc(zoomed)}</b> · ${n} ${n === 1 ? "well" : "wells"}` : `Click or drag across wells of <b>${esc(zoomed)}</b>`}</span>
        <button class="plain" id="all">All</button>${n ? `<button class="plain" id="none">Clear</button>` : ""}
        <span class="sep"></span>
        <input type="text" id="liquid" list="liquid-names" placeholder="liquid, e.g. buffer" size="12" value="${esc(liquid.name)}" spellcheck="false">
        <input type="number" id="volume" min="0" step="any" placeholder="µL each" style="width:6.5rem" value="${esc(liquid.volume)}">
        <button class="act" id="fillit" ${n && liquid.name.trim() && Number(liquid.volume) > 0 ? "" : "disabled"}>Fill</button>
        <button class="plain" id="emptyit" ${n ? "" : "disabled"}>Empty</button>
      </div>`;
    }

    // --- the editor below the drawing: robot and catalogue --------------------------------------------

    function renderEditor() {
      const offered = catalogs[current] || {};
      $("editor").hidden = !editing;
      if (!editing) return;
      const rails = ((layouts[current] || {}).deck || {}).rails || [];
      let html = "";
      if ((offered.decks || []).length) {
        html += `<div class="row"><label for="deck">Robot</label><select id="deck">${offered.decks.map(d => `<option value="${esc(d.kind)}" ${d.kind === offered.deck ? "selected" : ""}>${esc(d.label)}</option>`).join("")}</select>
          <span class="kind">each robot keeps its own worktable</span></div>`;
      }
      html += `<p>${rails.length ? "Drag a carrier onto the rails, and labware onto a carrier position." : "Drag labware onto an empty slot."} Drag what is there to move it. Click a plate or reservoir to fill its wells. Nothing on the robot moves.</p>`;
      const deck = (layouts[current] || {}).deck || {};
      const files = deck.pylabrobot_files || {};
      if (files.layout) {
        const link = (part, text) => `<a href="api/pylabrobot?worktable=${encodeURIComponent(current)}&part=${part}" download>${text}</a>`;
        html += `<p>Also saved as PyLabRobot reads it: ${link("layout", "the layout")} (every labware, placed; <code>Deck.load_from_json_file</code>) and ${link("state", "the starting state")} (full tips and these liquids; <code>deck.load_state_from_file</code>).</p>`;
      } else if (deck.pylabrobot_error) {
        html += `<p>Not saved for PyLabRobot: ${esc(deck.pylabrobot_error)}</p>`;
      }
      html += `<input type="search" id="query" placeholder="Search PyLabRobot labware (e.g. 96 wellplate, tiprack 300)" value="${esc(query)}" style="width:100%"><div id="palette"></div>`;
      $("editor").innerHTML = html;
      renderPalette();
    }

    const GROUPS = [["carrier", "Carriers"], ["plate", "Plates"], ["reservoir", "Reservoirs"], ["tip_rack", "Tip racks"], ["tube_rack", "Tube racks"]];
    function renderPalette() {
      const words = query.toLowerCase().split(/\s+/).filter(Boolean);
      const all = ((catalogs[current] || {}).labware || []).filter(d => words.every(w => d.definition.toLowerCase().includes(w)));
      let html = "";
      for (const [key, title] of GROUPS) {
        const shown = all.filter(d => d.category === key);
        if (!shown.length) continue;
        html += `<div class="group">${title}</div>` + shown.map(d =>
          `<button class="def ${armed && armed.definition === d.definition ? "on" : ""}" data-def="${esc(d.definition)}" data-cat="${esc(d.category)}" title="${esc(d.definition)}">${esc(d.definition)}</button>`).join("");
      }
      $("palette").innerHTML = html || `<div class="empty">Nothing matches.</div>`;
    }

    // --- changing the worktable --------------------------------------------------------------------

    async function applyEdit(change) {
      notice = null;
      const response = await fetch("api/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ worktable: current, ...change }) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) { notice = result.error || "That could not be done."; render(); return false; }
      if (result.restart_needed) restart = true;
      layouts = (result.layout || {}).worktables || layouts;
      catalogs = result.catalog || catalogs;
      states = (result.state || {}).worktables || states;
      armed = null;
      render();
      return true;
    }

    // Pointer position in worktable millimetres, and whether it is over the drawing.
    function toDeck(evt) {
      const svg = document.querySelector("#stage svg");
      if (!svg || !geom) return null;
      const ctm = svg.getScreenCTM();
      if (!ctm) return null;
      const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
      const p = pt.matrixTransform(ctm.inverse()), box = svg.getBoundingClientRect();
      const inside = evt.clientX >= box.left && evt.clientX <= box.right && evt.clientY >= box.top && evt.clientY <= box.bottom;
      return { x: p.x, y: geom.top - p.y, inside };
    }

    // Where a dragged thing would land: an empty place for labware, a rail for a carrier.
    function targetFor(evt) {
      const at = toDeck(evt), layout = layouts[current];
      if (!at || !at.inside || !layout) return null;
      if (drag.carrier) {
        const rails = layout.deck.rails || [];
        if (!rails.length) return null;
        // The pointer marks the carrier's left edge; a moved carrier keeps where it was grabbed.
        const left = at.x - (drag.grab || 0);
        const rail = rails.reduce((best, r) => Math.abs(r.x - left) < Math.abs(best.x - left) ? r : best, rails[0]);
        return { rails: rail.rail, x: rail.x };
      }
      const site = layout.sites.find(s => (!s.holds || s.holds === drag.name)
        && at.x >= s.x && at.x <= s.x + s.w && at.y >= s.y && at.y <= s.y + s.h);
      return site ? { site: site.label } : null;
    }

    function showTarget(target) {
      document.querySelectorAll("#stage .site.armed").forEach(el => el.classList.remove("armed"));
      const mark = $("railmark");
      if (mark) mark.setAttribute("visibility", target && target.rails ? "visible" : "hidden");
      if (!target) return;
      if (target.site) {
        const el = document.querySelector(`#stage .site[data-site="${CSS.escape(target.site)}"]`);
        if (el) el.classList.add("armed");
        return;
      }
      const Y = (y, h) => geom.top - (y + h);
      $("railline").setAttribute("x1", target.x); $("railline").setAttribute("x2", target.x);
      $("railline").setAttribute("y1", 0); $("railline").setAttribute("y2", geom.y1 - geom.y0);
      const label = $("raillabel");
      label.setAttribute("x", target.x + 4); label.setAttribute("y", 14);
      label.textContent = `rail ${target.rails}`;
      const box = $("railbox");
      if (drag.width) {
        box.setAttribute("x", target.x); box.setAttribute("y", Y(drag.y, drag.height));
        box.setAttribute("width", drag.width); box.setAttribute("height", drag.height);
        box.setAttribute("visibility", "visible");
      } else box.setAttribute("visibility", "hidden");
    }

    function startDrag(evt, what) {
      drag = { ...what, x: evt.clientX, y0: evt.clientY, started: false, target: null };
    }

    addEventListener("pointermove", evt => {
      if (picking) { pickAt(evt); return; }
      if (!drag) return;
      if (!drag.started) {
        if (Math.hypot(evt.clientX - drag.x, evt.clientY - drag.y0) < 5) return;
        drag.started = true;
        $("ghost").textContent = drag.label;
        $("ghost").hidden = false;
        if (drag.element) drag.element.classList.add("lifted");
      }
      $("ghost").style.left = evt.clientX + "px";
      $("ghost").style.top = evt.clientY + "px";
      drag.target = targetFor(evt);
      showTarget(drag.target);
    });

    addEventListener("pointerup", evt => {
      if (picking) { picking = null; return; }
      if (!drag) return;
      const done = drag;
      drag = null;
      $("ghost").hidden = true;
      if (done.element) done.element.classList.remove("lifted");
      showTarget(null);
      if (!done.started) { done.click && done.click(); return; }
      if (!done.target) return;
      if (done.name) applyEdit({ action: "move", name: done.name, ...(done.target.rails ? { rails: done.target.rails } : { site: done.target.site }) });
      else applyEdit({ action: "place", definition: done.definition, ...(done.target.rails ? { rails: done.target.rails } : { site: done.target.site }) });
    });

    // Picking wells: a drag paints a rectangle, adding when it started on an empty well, removing otherwise.
    let picking = null;
    function pickAt(evt) {
      const el = document.elementFromPoint(evt.clientX, evt.clientY);
      const well = el && el.closest && el.closest("[data-well]");
      if (!well) return;
      const ware = layouts[current].labware[zoomed];
      const r = Number(well.dataset.r), c = Number(well.dataset.c);
      const next = new Set(picking.base);
      for (let i = Math.min(picking.r, r); i <= Math.max(picking.r, r); i++)
        for (let j = Math.min(picking.c, c); j <= Math.max(picking.c, c); j++) {
          const id = ware.grid[i][j];
          if (picking.add) next.add(id); else next.delete(id);
        }
      if (next.size !== picked.size || [...next].some(id => !picked.has(id))) { picked = next; render(); }
    }

    document.addEventListener("pointerdown", evt => {
      if (evt.button !== 0) return;
      const t = evt.target;
      const def = t.closest(".def");
      if (def) {
        evt.preventDefault();
        const carrier = def.dataset.cat === "carrier";
        startDrag(evt, { definition: def.dataset.def, label: def.dataset.def, carrier,
          click: () => { armed = armed && armed.definition === def.dataset.def ? null : { definition: def.dataset.def, carrier }; renderPalette(); } });
        return;
      }
      if (!editing) return;
      const well = t.closest("#stage [data-well]");
      if (well) {
        evt.preventDefault();
        const id = well.dataset.well, add = !picked.has(id);
        picking = { r: Number(well.dataset.r), c: Number(well.dataset.c), add, base: new Set(picked) };
        picked = new Set(picked); if (add) picked.add(id); else picked.delete(id);
        render();
        return;
      }
      if (t.closest("[data-remove]")) return;
      // A carrier is grabbed by itself or by one of its empty positions.
      const siteEl = t.closest("#stage [data-site]");
      const site = siteEl && layouts[current].sites.find(x => x.label === siteEl.dataset.site);
      const carrierName = (t.closest("#stage [data-carrier]") || {}).dataset?.carrier || (site && !site.holds && site.carrier);
      const f = carrierName && layouts[current].fixtures.find(x => x.name === carrierName && x.editable && x.rails);
      if (f && !armed) {
        evt.preventDefault();
        const carrier = document.querySelector(`#stage [data-carrier="${CSS.escape(f.name)}"]`);
        const at = toDeck(evt);
        startDrag(evt, { name: f.name, label: f.name, carrier: true, element: carrier, width: f.w, height: f.h, y: f.y, grab: at ? at.x - f.x : 0 });
        return;
      }
      const ware = t.closest("#stage rect[data-ware]");
      if (ware && !zoomed) {
        const name = ware.dataset.ware, entry = layouts[current].labware[name];
        evt.preventDefault();
        if (!entry.editable) { startDrag(evt, { label: name, click: () => zoomTo(name) }); return; }
        startDrag(evt, { name, label: name, element: ware, click: () => zoomTo(name) });
      }
    });

    function zoomTo(name) {
      zoomed = zoomed === name ? null : name;
      picked = new Set();
      render();
    }

    // --- clicks and inputs ----------------------------------------------------------------------------

    document.addEventListener("click", evt => {
      const t = evt.target;
      const tab = t.closest("[data-tab]"), remove = t.closest("[data-remove]"), row = t.closest("tr[data-ware]");
      if (t.id === "edit") { editing = !editing; notice = null; armed = null; picked = new Set(); render(); return; }
      if (t.id === "dismiss") { notice = null; render(); return; }
      if (t.id === "restart") {
        fetch("/api/system/restart", { method: "POST" }).then(async r => {
          if (r.ok) { restart = false; editing = false; notice = null; }
          else notice = (await r.json().catch(() => ({}))).error || "The deck could not be restarted.";
          render();
        });
        return;
      }
      if (remove) { applyEdit({ action: "remove", name: remove.dataset.remove }); return; }
      if (t.id === "reset") { zoomed = null; picked = new Set(); render(); return; }
      if (t.id === "all") { picked = new Set(Object.keys(layouts[current].labware[zoomed].spots)); render(); return; }
      if (t.id === "none") { picked = new Set(); render(); return; }
      if (t.id === "fillit" || t.id === "emptyit") {
        const filling = t.id === "fillit";
        applyEdit({ action: "liquid", labware: zoomed, wells: [...picked], liquid: filling ? liquid.name.trim() : "",
                    volume_ul: filling ? Number(liquid.volume) : 0 }).then(ok => { if (ok) picked = new Set(); render(); });
        return;
      }
      if (tab) { current = tab.dataset.tab; zoomed = null; picked = new Set(); render(); return; }
      // Armed from the catalogue (a click instead of a drag): the next empty place, or rail, takes it.
      if (armed && editing) {
        const site = t.closest("#stage [data-site]");
        const layout = layouts[current];
        if (site && !armed.carrier) {
          const s = layout.sites.find(x => x.label === site.dataset.site);
          if (s && !s.holds) { applyEdit({ action: "place", definition: armed.definition, site: s.label }); return; }
        }
        if (armed.carrier && t.closest("#stage svg")) {
          drag = { carrier: true };
          const target = targetFor(evt);
          drag = null;
          if (target) { applyEdit({ action: "place", definition: armed.definition, rails: target.rails }); return; }
        }
      }
      if (row && !t.closest("input") && !t.closest("button")) { zoomTo(row.dataset.ware); return; }
      // Outside edit mode a plate is clicked to look at it (in edit mode the drag handler does that).
      const wareEl = t.closest("#stage rect[data-ware]");
      if (wareEl && !editing) zoomTo(wareEl.dataset.ware);
    });

    document.addEventListener("input", evt => {
      if (evt.target.id === "query") { query = evt.target.value; renderPalette(); }
      if (evt.target.id === "liquid" || evt.target.id === "volume") {
        liquid = { name: $("liquid").value, volume: $("volume").value };
        const ok = picked.size && liquid.name.trim() && Number(liquid.volume) > 0;
        $("fillit").disabled = !ok;
      }
    });
    document.addEventListener("change", evt => {
      if (evt.target.id === "deck") { zoomed = null; picked = new Set(); applyEdit({ action: "deck", deck: evt.target.value }); }
      if (evt.target.dataset && evt.target.dataset.rename !== undefined) {
        const from = evt.target.dataset.rename, to = evt.target.value.trim();
        if (to && to !== from) { if (zoomed === from) zoomed = to; applyEdit({ action: "rename", name: from, to }); }
      }
    });
    document.addEventListener("keydown", evt => {
      if (evt.key === "Enter" && evt.target.dataset && evt.target.dataset.rename !== undefined) evt.target.blur();
      if (evt.key === "Enter" && (evt.target.id === "liquid" || evt.target.id === "volume") && !$("fillit").disabled) $("fillit").click();
      if (evt.key === "Escape" && drag) { drag = null; $("ghost").hidden = true; showTarget(null); render(); }
    });

    // --- loading and following ----------------------------------------------------------------------

    async function loadLayout() {
      const found = await (await fetch("api/layout")).json();
      layouts = found.worktables || {};
      // A change made before this page was opened (or reloaded) still needs the restart.
      if ((found.restart_needed || []).length) restart = true;
      if (!current || !layouts[current]) current = Object.keys(layouts)[0] || null;
    }
    async function load() {
      await loadLayout();
      states = (await (await fetch("api/state")).json()).worktables || {};
      catalogs = (await (await fetch("api/catalog")).json()).worktables || {};
      render();
    }

    async function onMessage(message) {
      if (!message || !message.worktable) return;
      states[message.worktable] = message.state || {};
      if (message.relayout) {
        await loadLayout();
        catalogs = (await (await fetch("api/catalog")).json()).worktables || catalogs;
      }
      const event = message.event || {};
      if (message.worktable === current && event.labware && event.action !== "layout") {
        hit = { labware: event.labware, wells: new Set(event.wells || []) };
        clearTimeout(hitTimer);
        hitTimer = setTimeout(() => { hit = { labware: null, wells: new Set() }; if (!drag && !picking) render(); }, 1600);
      }
      const words = { aspirate: "aspirate from", dispense: "dispense into", pick_up_tips: "pick up tips from", drop_tips: "drop tips", move: "move", load: "filled" };
      if (event.action && event.action !== "layout") {
        $("activity").innerHTML = `${esc(words[event.action] || event.action)} ${event.labware ? `<b>${esc(event.labware)}</b>` : ""} ${esc(shortWells(event.wells || []))}`;
      }
      if (!drag && !picking) render();
    }

    function connect() {
      const url = new URL("events", location.href);
      url.protocol = url.protocol.replace("http", "ws");
      const ws = new WebSocket(url), live = $("live");
      ws.onopen = () => { live.classList.add("on"); live.lastElementChild.textContent = "live"; };
      ws.onmessage = e => onMessage(JSON.parse(e.data));
      ws.onclose = () => {  // the edge restarted: reconnect, and read the worktable again
        live.classList.remove("on"); live.lastElementChild.textContent = "reconnecting";
        setTimeout(() => { connect(); load().catch(() => {}); }, 2000);
      };
    }

    load().then(connect);
  </script>
</body>
</html>

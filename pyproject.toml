[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plr-ivoryos"
# Versioned with the PyLabRobot it is written against: 1.x is PyLabRobot 1.x. While PyLabRobot 1.0
# is in beta, each beta of this package is pinned to exactly one of its betas, since a beta can
# rename what this package calls.
version = "1.0.0b1"
description = "IvoryOS-compatible wrappers for PyLabRobot devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IvoryOS Contributors"}
]
keywords = ["lab-automation", "ivoryos", "pylabrobot", "liquid-handler", "opentrons-flex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pylabrobot==1.0.0b1",
]

[project.optional-dependencies]
# PyLabRobot keeps each connection library in an extra; these pass them through, so one requirement
# on a Hub row installs what an instrument needs. A Flex over Ethernet needs none; over its USB-B
# port, plr-ivoryos[serial].
serial = ["pylabrobot[serial]==1.0.0b1"]
usb = ["pylabrobot[usb]==1.0.0b1"]
ftdi = ["pylabrobot[ftdi]==1.0.0b1"]
hid = ["pylabrobot[hid]==1.0.0b1"]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/ivoryos-ai/IvoryOS-PyLabRobot-Integration"

[tool.setuptools.packages.find]
include = ["plr_ivoryos*"]

# The Labware view's page ships with the package (labware_view/__init__.py).
[tool.setuptools.package-data]
"plr_ivoryos.labware_view" = ["page/*"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plr-ivoryos"
version = "0.2.1"
description = "IvoryOS-compatible wrappers for PyLabRobot devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IvoryOS Contributors"}
]
keywords = ["lab-automation", "ivoryos", "pylabrobot", "liquid-handler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # 1.0 (in beta) renames resources and labware this package relies on; supporting it is a
    # later release.
    "pylabrobot>=0.2.2,<1.0",
]

[project.optional-dependencies]
# PyLabRobot keeps each connection library in an extra; these pass them through, so one requirement
# installs what an instrument needs (plr-ivoryos[usb] for a Hamilton STAR, [serial] for a sealer).
serial = ["pylabrobot[serial]>=0.2.2,<1.0"]
usb = ["pylabrobot[usb]>=0.2.2,<1.0"]
ftdi = ["pylabrobot[ftdi]>=0.2.2,<1.0"]
hid = ["pylabrobot[hid]>=0.2.2,<1.0"]
opentrons = ["pylabrobot[opentrons]>=0.2.2,<1.0"]
sila = ["pylabrobot[sila]>=0.2.2,<1.0"]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/heingroup/ivoryos"

[tool.setuptools.packages.find]
include = ["plr_ivoryos*"]

# The Labware view's page ships with the package (labware_view/__init__.py).
[tool.setuptools.package-data]
"plr_ivoryos.labware_view" = ["page/*"]
